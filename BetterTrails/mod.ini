[Mod]
Version = 1
Id = better-trails
Release = 1.1.1
Name = Better Trails
Description = The new and improved Auto Trail Lights. Dress a whole trail in one click with the game's own pieces: Tower Lights along both edges (Uniform or Jagged, any color or a rainbow Party mode, night skiing on), rope lights (Festoon or Hanging Lanterns, any color) along the edges or zigzagging across, snowblowers aimed across the trail, difficulty and junction signs in your trail rating style, and flags on steep sections. Shows how much of the trail is lit. Everything is charged at the normal price and sold back for a refund.
Usage = Click a trail and open its Edit tab. In the Better Trails section pick a tab (Towers, Ropes, Snow, Signs or Flags), pick the options, then click Install. Remove sells that tab's pieces back. Better Trails replaces Auto Trail Lights: turn Auto Trail Lights off, and Better Trails takes over the lights it placed.
